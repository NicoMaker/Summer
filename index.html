<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buona Estate 2024</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Summer paradise scene -->
    <div class="summer-scene">
      <!-- Sky gradient overlay -->
      <div class="sky-gradient"></div>
      
      <!-- Animated title -->
      <h1 class="title">
        <span class="title-word">Buona</span>
        <span class="title-word">Estate</span>
        <span class="title-year">2024</span>
      </h1>
      
      <!-- Sun with rays -->
      <div class="sun-container">
        <div class="sun">☀️</div>
        <div class="sun-rays"></div>
      </div>
      
      <!-- Enhanced seagulls with shadows -->
      <div class="seagull seagull1">
        <span class="seagull-shadow">🐦</span>
        <span class="seagull-main">🐦</span>
      </div>
      <div class="seagull seagull2">
        <span class="seagull-shadow">🐦</span>
        <span class="seagull-main">🐦</span>
      </div>
      <div class="seagull seagull3">
        <span class="seagull-shadow">🐦</span>
        <span class="seagull-main">🐦</span>
      </div>
      <div class="seagull seagull4">
        <span class="seagull-shadow">🐦</span>
        <span class="seagull-main">🐦</span>
      </div>
      
      <!-- Volumetric clouds -->
      <div class="cloud-container">
        <div class="cloud cloud1">
          <span>☁️</span><span>☁️</span><span>☁️</span>
        </div>
        <div class="cloud cloud2">
          <span>☁️</span><span>☁️</span>
        </div>
        <div class="cloud cloud3">
          <span>☁️</span><span>☁️</span><span>☁️</span>
        </div>
      </div>
      
      <!-- Beach paradise section -->
      <div class="beach-section">
        <div class="sand-dunes"></div>
        <div class="beach-item umbrella">⛱️</div>
        <div class="beach-item beach-chair">🏖️</div>
        <div class="beach-item palm-tree">🌴</div>
        <div class="beach-item cocktail">🍹</div>
        <div class="beach-item beach-ball">🏐</div>
        <div class="beach-item coconut">🥥</div>
        <div class="beach-item watermelon">🍉</div>
        <div class="beach-item sunglasses">🕶️</div>
        <div class="beach-sparkle sparkle1">✨</div>
        <div class="beach-sparkle sparkle2">✨</div>
        <div class="beach-sparkle sparkle3">✨</div>
      </div>
      
      <!-- Dynamic ocean waves -->
      <div class="ocean-surface">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="wave-foam foam1"></div>
        <div class="wave-foam foam2"></div>
      </div>
      
      <!-- Boats with reflections -->
      <div class="boat-container">
        <div class="boat boat1">
          <span class="boat-icon">⛵</span>
          <span class="boat-reflection">⛵</span>
        </div>
        <div class="boat boat2">
          <span class="boat-icon">🚤</span>
          <span class="boat-reflection">🚤</span>
        </div>
        <div class="boat boat3">
          <span class="boat-icon">⛵</span>
          <span class="boat-reflection">⛵</span>
        </div>
      </div>
      
      <!-- Surfers with water splash -->
      <div class="surfer surfer1">
        <span>🏄‍♂️</span>
        <span class="water-splash">💦</span>
      </div>
      <div class="surfer surfer2">
        <span>🏄‍♀️</span>
        <span class="water-splash">💦</span>
      </div>
      <div class="surfer surfer3">
        <span>🤽</span>
        <span class="water-splash">💦</span>
      </div>
      
      <!-- Tropical paradise island -->
      <div class="island">
        <div class="island-glow"></div>
        <div class="island-base"></div>
        <div class="island-palm palm1">🌴</div>
        <div class="island-palm palm2">🌴</div>
        <div class="island-palm palm3">🌴</div>
        <div class="island-crab">🦀</div>
        <div class="island-shell">🐚</div>
        <div class="island-flower">🌺</div>
      </div>
      
      <!-- Vibrant tropical flowers -->
      <div class="flower flower1">
        <span class="flower-glow">🌺</span>
      </div>
      <div class="flower flower2">
        <span class="flower-glow">🌺</span>
      </div>
      <div class="flower flower3">
        <span class="flower-glow">🌸</span>
      </div>
      <div class="flower flower4">
        <span class="flower-glow">🏵️</span>
      </div>
      <div class="flower flower5">
        <span class="flower-glow">🌺</span>
      </div>
      
      <!-- Playful dolphins -->
      <div class="dolphin dolphin1">
        <span>🐬</span>
        <span class="dolphin-trail">💧</span>
      </div>
      <div class="dolphin dolphin2">
        <span>🐬</span>
        <span class="dolphin-trail">💧</span>
      </div>
      <div class="dolphin dolphin3">
        <span>🐬</span>
        <span class="dolphin-trail">💧</span>
      </div>
      
      <!-- Happy swimmers -->
      <div class="swimmer swimmer1">
        <span>🏊</span>
        <span class="swimmer-ripple">〰️</span>
      </div>
      <div class="swimmer swimmer2">
        <span>🏊‍♀️</span>
        <span class="swimmer-ripple">〰️</span>
      </div>
      <div class="swimmer swimmer3">
        <span>🤽‍♂️</span>
        <span class="swimmer-ripple">〰️</span>
      </div>
      
      <!-- Magical underwater world -->
      <div class="underwater-section">
        <!-- Sea creatures with glow effects -->
        <div class="sea-creature octopus">
          <span class="creature-glow">🐙</span>
        </div>
        <div class="sea-creature turtle">
          <span class="creature-glow">🐢</span>
        </div>
        <div class="sea-creature fish1">
          <span class="creature-glow">🐠</span>
        </div>
        <div class="sea-creature fish2">
          <span class="creature-glow">🐡</span>
        </div>
        <div class="sea-creature fish3">
          <span class="creature-glow">🦭</span>
        </div>
        <div class="sea-creature squid">
          <span class="creature-glow">🦑</span>
        </div>
        <div class="sea-creature jellyfish">
          <span class="creature-glow">🪼</span>
        </div>
        <div class="sea-creature shark">
          <span class="creature-glow">🦈</span>
        </div>
        <div class="sea-creature whale">
          <span class="creature-glow">🐋</span>
        </div>
      </div>
      
      <!-- Glowing coral reef -->
      <div class="coral-reef">
        <div class="coral coral1">
          <span class="coral-glow">🪸</span>
        </div>
        <div class="coral coral2">
          <span class="coral-glow">🪸</span>
        </div>
        <div class="coral coral3">
          <span class="coral-glow">🪸</span>
        </div>
        <div class="coral coral4">
          <span class="coral-glow">🪸</span>
        </div>
      </div>
      
      <!-- Ocean floor treasures -->
      <div class="ocean-floor">
        <div class="floor-item starfish1">
          <span class="floor-glow">⭐</span>
        </div>
        <div class="floor-item starfish2">
          <span class="floor-glow">⭐</span>
        </div>
        <div class="floor-item shell1">
          <span class="floor-glow">🐚</span>
        </div>
        <div class="floor-item shell2">
          <span class="floor-glow">🐚</span>
        </div>
        <div class="floor-item crab">
          <span class="floor-glow">🦀</span>
        </div>
        <div class="floor-item anchor">
          <span class="floor-glow">⚓</span>
        </div>
        
        <!-- Epic treasure chest -->
        <div class="treasure">
          <span class="treasure-icon">💎</span>
          <span class="treasure-sparkle">✨</span>
          <span class="treasure-light"></span>
        </div>
      </div>
      
      <!-- Epic bottom message -->
      <div class="bottom-message">
        <span class="message-text">Mare</span>
        <span class="message-divider">•</span>
        <span class="message-text">Sole</span>
        <span class="message-divider">•</span>
        <span class="message-text">Estate</span>
      </div>
      
      <!-- Animated light rays -->
      <div class="light-rays">
        <div class="light-ray ray1"></div>
        <div class="light-ray ray2"></div>
        <div class="light-ray ray3"></div>
        <div class="light-ray ray4"></div>
      </div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
