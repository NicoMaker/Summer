<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buona Estate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Single scrollable section with all summer elements -->
    <div class="summer-scene">
      <h1 class="title">Buona Estate!</h1>
      
      <!-- Sun and sky elements -->
      <div class="sun">☀️</div>
      <div class="seagull seagull1">🐦</div>
      <div class="seagull seagull2">🐦</div>
      <div class="seagull seagull3">🐦</div>
      <div class="seagull seagull4">🐦</div>
      
      <!-- Clouds -->
      <div class="cloud cloud1">☁️</div>
      <div class="cloud cloud2">☁️</div>
      
      <!-- Beach elements on top -->
      <div class="beach-item umbrella">⛱️</div>
      <div class="beach-item beach-chair">🏖️</div>
      <div class="beach-item palm-tree">🌴</div>
      <div class="beach-item cocktail">🍹</div>
      <div class="beach-item beach-ball">🏐</div>
      <div class="beach-item coconut">🥥</div>
      <div class="beach-item watermelon">🍉</div>
      
      <!-- Waves and ocean surface -->
      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
      <div class="wave wave3"></div>
      
      <!-- Boats and surfers -->
      <div class="boat boat1">⛵</div>
      <div class="boat boat2">🚤</div>
      <div class="boat boat3">⛵</div>
      <div class="surfer surfer1">🏄‍♂️</div>
      <div class="surfer surfer2">🏄‍♀️</div>
      <div class="surfer surfer3">🤽</div>
      
      <!-- Island with palms -->
      <div class="island">
        <div class="island-base"></div>
        <div class="island-palm palm1">🌴</div>
        <div class="island-palm palm2">🌴</div>
        <div class="island-palm palm3">🌴</div>
        <div class="island-crab">🦀</div>
        <div class="island-shell">🐚</div>
      </div>
      
      <!-- Tropical flowers -->
      <div class="flower flower1">🌺</div>
      <div class="flower flower2">🌺</div>
      <div class="flower flower3">🌸</div>
      <div class="flower flower4">🏵️</div>
      
      <!-- Dolphins jumping -->
      <div class="dolphin dolphin1">🐬</div>
      <div class="dolphin dolphin2">🐬</div>
      <div class="dolphin dolphin3">🐬</div>
      
      <!-- Swimmers -->
      <div class="swimmer swimmer1">🏊</div>
      <div class="swimmer swimmer2">🏊‍♀️</div>
      <div class="swimmer swimmer3">🤽‍♂️</div>
      
      <!-- Sea creatures -->
      <div class="sea-creature octopus">🐙</div>
      <div class="sea-creature turtle">🐢</div>
      <div class="sea-creature fish1">🐠</div>
      <div class="sea-creature fish2">🐡</div>
      <div class="sea-creature fish3">🦭</div>
      <div class="sea-creature squid">🦑</div>
      <div class="sea-creature jellyfish">🪼</div>
      <div class="sea-creature shark">🦈</div>
      <div class="sea-creature whale">🐋</div>
      
      <!-- Coral and seaweed -->
      <div class="coral coral1">🪸</div>
      <div class="coral coral2">🪸</div>
      <div class="coral coral3">🪸</div>
      
      <!-- Ocean floor decorations -->
      <div class="floor-item starfish1">⭐</div>
      <div class="floor-item starfish2">⭐</div>
      <div class="floor-item shell1">🐚</div>
      <div class="floor-item shell2">🐚</div>
      <div class="floor-item crab">🦀</div>
      <div class="floor-item treasure">💎</div>
      <div class="floor-item anchor">⚓</div>
      
      <div class="bottom-message">Mare • Sole • Estate 2024</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
